# Dokploy: origen Git, modo Docker Compose (no Stack). Dominio -> frontier-agent-api:8000.
# Dokploy puede fijar -p; conservar ese nombre para reutilizar los volúmenes.
name: frontier-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime: &runtime
  image: frontier-agent:${RELEASE_TAG:-local}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  entrypoint: [python, -m, app.persistence.compose_runtime]
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
  stop_grace_period: 30s
  logging: *logging
  depends_on:
    frontier-agent-postgres: {condition: service_healthy}
    frontier-agent-redis: {condition: service_healthy}

x-ready: &ready
  frontier-agent-postgres: {condition: service_healthy}
  frontier-agent-redis: {condition: service_healthy}
  frontier-agent-bootstrap: {condition: service_completed_successfully}

services:
  frontier-agent-postgres:
    image: postgres:16.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: frontier
      POSTGRES_DB: frontier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in Dokploy}
    volumes: [frontier_agent_pg:/var/lib/postgresql/data]
    networks: [backend]
    logging: *logging
    stop_grace_period: 60s
    shm_size: 128m
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '${POSTGRES_CPUS:-1.0}', memory: '${POSTGRES_MEMORY:-1G}'}
        reservations: {cpus: '0.25', memory: 256M}
  frontier-agent-redis:
    image: redis:7.4.8-bookworm
    # No evictar referencias de tareas cuando la memoria se llena.
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, '${REDIS_MAXMEMORY:-256mb}', --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [frontier_agent_redis:/data]
    networks: [backend]
    logging: *logging
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '${REDIS_CPUS:-0.5}', memory: '${REDIS_MEMORY:-512M}'}
        reservations: {cpus: '0.1', memory: 128M}
  frontier-agent-bootstrap:
    <<: *runtime
    restart: 'no'
    # Job único por despliegue: runtime espera migraciones, memoria y grants.
    command: [bootstrap]
    volumes:
      - frontier_agent_api_connection:/var/lib/frontier/connections/api
      - frontier_agent_dispatcher_connection:/var/lib/frontier/connections/dispatcher
      - frontier_agent_worker_connection:/var/lib/frontier/connections/worker
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in Dokploy}
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      LANGGRAPH_DATABASE_URI: ${BOOTSTRAP_LANGGRAPH_DATABASE_URI:-}
      GRANTS_DATABASE_URL: ${GRANTS_DATABASE_URL:-}
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '1.0', memory: 512M}
        reservations: {cpus: '0.1', memory: 128M}
  frontier-agent-api:
    <<: *runtime
    command: [uvicorn, 'app.api.main:app', --host, '0.0.0.0', --port, '8000', --no-access-log]
    networks: [backend, ingress]
    depends_on: *ready
    expose: ['8000']
    volumes: [frontier_agent_api_connection:/var/lib/frontier/connections/api:ro]
    environment:
      TEAM_ID: ${TEAM_ID:-frontier}
      TEAM_ENTRYPOINT_TOKEN: ${TEAM_ENTRYPOINT_TOKEN:?Set team token}
      FRONTIER_SERVICE_ROLE: api
      DATABASE_URL: ${API_DATABASE_URL:-}
      REDIS_URL: redis://frontier-agent-redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Set encryption key}
      DESTINATION_HMAC_KEY: ${DESTINATION_HMAC_KEY:?Set HMAC key}
      ALLOW_PRIVATE_DESKTOPS: ${ALLOW_PRIVATE_DESKTOPS:-false}
      LANGSMITH_TRACING: 'false'
    healthcheck:
      test: [CMD, python, -c, 'import os,urllib.request; r=urllib.request.Request("http://127.0.0.1:8000/health",headers={"Authorization":"Bearer "+os.environ["TEAM_ENTRYPOINT_TOKEN"]}); urllib.request.urlopen(r,timeout=2).close()']
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits: {cpus: '${API_CPUS:-0.5}', memory: '${API_MEMORY:-512M}'}
        reservations: {cpus: '0.1', memory: 128M}
  frontier-agent-dispatcher:
    <<: *runtime
    command: [python, -m, app.queue.main]
    volumes: [frontier_agent_dispatcher_connection:/var/lib/frontier/connections/dispatcher:ro]
    depends_on: *ready
    environment:
      FRONTIER_SERVICE_ROLE: dispatcher
      DATABASE_URL: ${DISPATCHER_DATABASE_URL:-}
      REDIS_URL: redis://frontier-agent-redis:6379/0
      LANGSMITH_TRACING: 'false'
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '${DISPATCHER_CPUS:-0.25}', memory: '${DISPATCHER_MEMORY:-256M}'}
        reservations: {cpus: '0.05', memory: 64M}
  frontier-agent-worker:
    <<: *runtime
    command: [python, -m, app.worker.main]
    depends_on: *ready
    # Egress required for model and supplied remote VNC; DB stays on internal backend.
    networks: [backend, egress]
    volumes:
      - frontier_agent_artifacts:/var/lib/frontier/artifacts
      - frontier_agent_worker_connection:/var/lib/frontier/connections/worker:ro
    environment:
      FRONTIER_SERVICE_ROLE: worker
      DATABASE_URL: ${WORKER_DATABASE_URL:-}
      LANGGRAPH_DATABASE_URI: ${LANGGRAPH_DATABASE_URI:-}
      REDIS_URL: redis://frontier-agent-redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Set encryption key}
      DESTINATION_HMAC_KEY: ${DESTINATION_HMAC_KEY:?Set HMAC key}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OpenRouter key}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      MODEL_NAME: ${MODEL_NAME:-openai/gpt-6.1-sol}
      MODEL_COORDINATOR: ${MODEL_COORDINATOR:-openai/gpt-6-luna}
      MODEL_OPERATOR: ${MODEL_OPERATOR:-openai/gpt-6-luna}
      MODEL_VERIFIER: ${MODEL_VERIFIER:-anthropic/claude-sonnet-5.5}
      MODEL_RECOVERY: ${MODEL_RECOVERY:-openai/gpt-6.1-sol}
      MODEL_ANALYST: ${MODEL_ANALYST:-openai/gpt-6-luna}
      MODEL_JEV: ${MODEL_JEV:-typesafe/jev-1.13}
      MODEL_PROFILES: ${MODEL_PROFILES:-null}
      GRAPH_VERSION: ${GRAPH_VERSION:-context-v2}
      OPENROUTER_JEV_ENDPOINT: ${OPENROUTER_JEV_ENDPOINT:-/api/alpha/decisions}
      OPENROUTER_PROVIDER_SORT: ${OPENROUTER_PROVIDER_SORT:-latency}
      OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}
      OPENROUTER_ALLOW_FALLBACKS: ${OPENROUTER_ALLOW_FALLBACKS:-false}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-3}
      JEV_MAX_CALLS: ${JEV_MAX_CALLS:-4}
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-low}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      ACTION_PROPOSAL_TTL_SECONDS: ${ACTION_PROPOSAL_TTL_SECONDS:-30}
      ARTIFACT_DIR: /var/lib/frontier/artifacts
      ALLOW_PRIVATE_DESKTOPS: ${ALLOW_PRIVATE_DESKTOPS:-false}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
      LANGSMITH_TRACING: 'false'
    stop_grace_period: 300s
    deploy:
      # Mantener 1 hasta aprobar exclusión global/crash/R05.
      replicas: 1
      resources:
        limits: {cpus: '${WORKER_CPUS:-2.0}', memory: '${WORKER_MEMORY:-2G}'}
        reservations: {cpus: '0.5', memory: 512M}

volumes:
  # Sin name global: Compose/Dokploy añade el prefijo del proyecto.
  frontier_agent_pg:
  frontier_agent_redis:
  frontier_agent_artifacts:
  frontier_agent_api_connection:
  frontier_agent_dispatcher_connection:
  frontier_agent_worker_connection:
networks:
  backend: {internal: true}
  egress: {}
  ingress:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
