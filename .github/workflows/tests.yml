name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-bookworm
        env:
          POSTGRES_DB: frontier_test
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U frontier -d frontier_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.8-bookworm
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.5'
      - run: uv sync --frozen --extra dev
      - run: uv run --extra dev pytest -m 'not e2e and not release'
        env:
          BOOTSTRAP_TEST_DATABASE_URI: postgresql://frontier:test_only@localhost:5432/frontier_test
          TEST_DATABASE_URL: postgresql+psycopg://frontier:test_only@localhost:5432/frontier_test
          TEST_REDIS_URL: redis://localhost:6379/1
      - run: python3 scripts/check_public_files.py
